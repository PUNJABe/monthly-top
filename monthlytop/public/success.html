<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Payment status</title>
<meta name="description" content="A public leaderboard for websites, profiles, apps and AI tools. Pay more, rank higher.">
<script>try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main><div class="wrap"><div class="prose">

  <div id="s" class="panel" style="text-align:center;padding:48px 24px"><p class="muted">Confirming your payment…</p></div>
</div></div></main>
<script src="/js/app.js"></script>
<script>
(async () => {
  await App.ready;
  const p = new URLSearchParams(location.search), id = p.get('boost'), sid = p.get('session_id');
  const el = document.getElementById('s');
  async function check(i) {
    try {
      const b = await App.api('/api/boost/' + encodeURIComponent(id) + (sid ? '?session_id=' + encodeURIComponent(sid) : ''));
      if (b.status === 'paid') {
        el.innerHTML = `<div style="font-size:3rem">🎉</div><h1 style="font-size:2rem">Boost received</h1>
          <p class="muted">${App.money(b.amount_cents, b.currency)} for <b style="color:var(--text)">${App.esc(b.title)}</b> (${App.esc(b.key)}). It is now on the chart.</p>
          <p><a class="btn" href="/listing.html?id=${encodeURIComponent(b.listing_id)}">See the listing</a> <a class="btn ghost" href="/">View the chart</a></p>`;
        return;
      }
      if (i < 8) { setTimeout(() => check(i + 1), 2000); return; }
      el.innerHTML = '<h2>Still processing</h2><p class="muted">Your payment has not been confirmed yet. If you were charged, your boost will appear shortly. If it does not, <a href="/contact.html" style="color:var(--accent)">contact us</a> with your email.</p>';
    } catch (e) { el.innerHTML = '<h2>We could not find that boost</h2><p><a class="btn" href="/">Back to the chart</a></p>'; }
  }
  if (!id) el.innerHTML = '<h2>Nothing to show</h2><p><a class="btn" href="/">Back to the chart</a></p>'; else check(0);
})();
</script>
</body>
</html>
